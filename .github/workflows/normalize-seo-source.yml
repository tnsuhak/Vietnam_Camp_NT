name: Normalize Nha Trang SEO source

on:
  push:
    branches:
      - update-2027-content-videos

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-2027-content-videos
      - name: Normalize canonical and search files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://YOUR-DOMAIN-HERE/nhatrang.html', 'https://tnsuhak.github.io/Vietnam_Camp_NT/')
          p.write_text(s, encoding='utf-8')
          Path('robots.txt').write_text('User-agent: *\nAllow: /\n\nSitemap: https://tnsuhak.github.io/Vietnam_Camp_NT/sitemap.xml\n', encoding='utf-8')
          Path('sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>https://tnsuhak.github.io/Vietnam_Camp_NT/</loc>\n    <lastmod>2026-09-01</lastmod>\n  </url>\n</urlset>\n', encoding='utf-8')
          PY
      - name: Commit normalized SEO source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "No SEO source changes needed"
          else
            git commit -m "Normalize Nha Trang canonical and search files"
            git push origin HEAD:update-2027-content-videos
          fi
