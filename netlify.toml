[build]
  command = "node scripts/patch-site.js && node scripts/contact-patch.js && node scripts/fix-camp-labels.js && node scripts/seo-build-fix.js && node scripts/promo-patch.js"
  publish = "."

[[headers]]
  for = "/media/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/mp4"
